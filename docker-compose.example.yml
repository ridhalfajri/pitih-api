version: "3.8"

services:
  pitih-web:
    build: ./apps/pitih-web
    container_name: pitih-web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://pitih-api:8000
    networks:
      - pitih-network

  pitih-api:
    build: ./apps/pitih-api
    container_name: pitih-api
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_BOT_TOKEN_PITIH=${TELEGRAM_BOT_TOKEN_PITIH}
      - DB_PATH=/data/keuangan.db
      - RECEIPTS_DIR=/data/receipts
      - AI_API_BASE=http://9router:20128/v1
      - AI_API_KEY=sk-9router-local
      - AI_MODEL=gemid
    volumes:
      - /opt/data/keuangan:/data
    networks:
      - pitih-network

networks:
  pitih-network:
    driver: bridge
